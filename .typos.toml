[default.extend-words]
hda = "hda"
HDA = "HDA"
aout = "aout"
AOUT = "AOUT"
BRE = "BRE"

[type.css.extend-words]
# Keep the misspelled custom property used by mdBook's built-in themes.
existant = "existant"

[files]
# `.ktest` scripts simulate raw keystroke streams (vi commands, escape
# sequences, etc.) where character clusters like `IY`, `wQ`, `OX` are
# data — not English text. Skip them entirely.
extend-exclude = [
    "ktest/suites/**",
]
