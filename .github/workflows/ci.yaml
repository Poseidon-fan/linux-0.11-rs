name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        # Every crate in the repo with its own Cargo.toml.
        # The nightly-only crates (kernel/user_lib/user_program/user_lib_macros)
        # pick up their toolchain from their per-crate rust-toolchain.toml;
        # the stable crates use the action's default stable toolchain.
        crate:
          - kernel
          - user_lib
          - user_lib_macros
          - user_program
          - ktest
          - mbrkit
          - miniximg
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: cargo fmt --check
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy -- -D warnings

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.39.0

  e2e:
    name: ktest end-to-end
    runs-on: ubuntu-latest
    # Skip the long e2e job on doc-only changes.
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            binutils-x86-64-linux-gnu \
            python3 \
            dosfstools

      - name: Cache cargo registry + targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel
            user_lib
            user_lib_macros
            user_program
            ktest
            mbrkit
            miniximg

      - name: Install mbrkit + miniximg
        run: |
          cargo install --path mbrkit --locked
          cargo install --path miniximg/miniximg-cli --locked

      - name: Build kernel (serial console)
        run: make -C kernel Image-console-release

      - name: Build user programs (explicit)
        run: make -C user_program all

      - name: Build disk image
        run: tools/build-disk.sh --no-build

      - name: Sanity-check image contents
        run: |
          echo "--- user_program/aout/ ---"
          ls -la user_program/aout/ | head -20
          echo "--- disk.img ---"
          ls -la disk.img
          mbrkit verify disk.img | head -20

      - name: Boot QEMU standalone (diagnostic)
        run: |
          set +e
          timeout 20 qemu-system-i386 \
            -m 16M -boot a \
            -drive file=kernel/Image-console-release,format=raw,if=floppy \
            -drive file=disk.img,format=raw,if=ide,index=0 \
            -nographic -serial mon:stdio </dev/null 2>&1 | head -200
          echo "(boot diagnostic complete)"

      - name: Run ktest
        env:
          KERNEL: ${{ github.workspace }}/kernel/Image-console-release
          IMAGE:  ${{ github.workspace }}/disk.img
        run: tools/run-tests.sh --show-log-on-fail

      - name: Upload artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktest-failure-artifacts
          path: |
            target/test-out/
            disk.img
            kernel/Image-console-release
          if-no-files-found: ignore
